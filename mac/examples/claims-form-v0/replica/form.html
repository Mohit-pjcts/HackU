<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Society claims form (replica)</title>
<style>
:root{font:16px -apple-system,BlinkMacSystemFont,sans-serif;color:#1d1d1f}
body{max-width:560px;margin:28px auto;padding:0 18px}
h1{font-size:22px;margin:0 0 4px}.sub{color:#6e6e73;font-size:13px;margin-bottom:14px}
label{display:block;margin-top:14px;font-weight:600;font-size:14px}
input[type=text],select{width:100%;font-size:16px;padding:8px;margin-top:4px;box-sizing:border-box}
fieldset{margin-top:16px;border:1px solid #d2d2d7;padding:8px 12px}legend{font-weight:600;font-size:14px}
fieldset label{display:inline-block;margin:6px 16px 6px 0;font-weight:400}
.row{display:flex;gap:10px;margin-top:20px}button{font-size:16px;padding:9px 16px;border-radius:8px;border:1px solid #888;background:#f5f5f7}
button.primary{background:#0071e3;color:#fff;border-color:#0071e3}
.banner{background:#e8f7ec;border:1px solid #34c759;padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:14px}
.tag{display:inline-block;background:#fff3cd;border:1px solid #ffda6a;padding:1px 8px;border-radius:99px;font-size:12px}
</style></head><body>
<!--BANNER-->
<h1>Society reimbursement claim</h1>
<div class="sub"><span class="tag">replica for testing</span> One claim per submission.</div>
<form method="POST" action="/submit" autocomplete="off">
  <label>Payee name <input type="text" name="payee" aria-label="Payee name" autocomplete="off"></label>
  <label>Amount (HKD) <input type="text" name="amount" aria-label="Amount (HKD)" inputmode="decimal" autocomplete="off"></label>
  <label>Date of expense (DD/MM/YYYY) <input type="text" name="date" aria-label="Date of expense (DD/MM/YYYY)" autocomplete="off"></label>
  <label>Category
    <select name="category" aria-label="Category">
      <option value="">Choose…</option><option>Food</option><option>Transport</option><option>Printing</option><option>Venue</option>
    </select></label>
  <fieldset><legend>Paid by</legend>
    <label><input type="radio" name="paidby" value="Cash" aria-label="Cash"> Cash</label>
    <label><input type="radio" name="paidby" value="FPS" aria-label="FPS"> FPS</label>
  </fieldset>
  <div class="row">
    <button type="submit" class="primary" aria-label="Submit claim">Submit claim</button>
    <button type="reset" aria-label="Clear form">Clear form</button>
  </div>
</form>
</body></html>
